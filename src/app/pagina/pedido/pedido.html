<section class="pedido">

  @if (pedido.length === 0) {

    <p class="text-center">
      Todavía no has añadido ninguna pizza.
    </p>

  } @else {

    <div class="lista-pedido">

      @for (item of pedido; track item.pizza.id) {

        <div class="fila-pedido">

          <span>
            {{ item.cantidad }} x {{ item.pizza.nombre }}
          </span>

          <strong>
            {{ item.pizza.precio * item.cantidad }} €
          </strong>

        </div>

      }

    </div>

    <div class="total-pedido">
      Total: {{ calcularTotal() }} €
    </div>

  }

</section>
