<app-header></app-header>

<app-navbar
  [mostrarBuscador]="paginaActual === 'listado'"
  (ingredienteSeleccionado)="recibirIngrediente($event)"
  (paginaSeleccionada)="cambiarPagina($event)">
</app-navbar>

<main class="container my-4">

  <!-- LISTADO -->
  @if (paginaActual === 'listado') {

    <app-lista-pizzas
      [ingrediente]="ingredienteBuscado"
      (pizzaAgregada)="agregarAlPedido($event)">
    </app-lista-pizzas>

    @if (mensajeGracias !== '') {
      <div class="alert alert-success text-center my-4">
        <h3>{{ mensajeGracias }}</h3>
        <p class="mb-0">
          ¡Esperamos que disfrutes de tus pizzas!
        </p>
      </div>
    }

  }

  <!-- PEDIDO -->
  @if (paginaActual === 'pedido') {

    <h2 class="text-center mb-4">Mi pedido</h2>

    <app-pedido [pedido]="pedido"></app-pedido>

    @if (pedido.length > 0) {

      <app-formulario
        (pedidoRealizado)="finalizarPedido()">
      </app-formulario>

    }

  }

</main>

<app-footer></app-footer>
